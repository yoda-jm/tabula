name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: |
          set -o pipefail
          go test -race -count=1 ./... 2>&1 | tee go-test.log
      - name: failed tests as annotations # readable without signing in to GitHub
        if: failure()
        run: echo "::error::$(grep -E -A2 -e '--- FAIL|^FAIL|panic:|\.go:[0-9]+:|DATA RACE' go-test.log | head -60 | sed 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }')"

  # tabula is released for macOS and Windows too: their tests run there
  test-os:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false # the scene files in testdata keep their line feeds
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 ./... 2>&1 | tee go-test.log
      - name: failed tests as annotations # readable without signing in to GitHub
        if: failure()
        shell: bash
        run: echo "::error::$(grep -E -A2 -e '--- FAIL|^FAIL|panic:|\.go:[0-9]+:' go-test.log | head -60 | sed 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }')"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5 # the page tests render the pages from what tabula serves (go run ./web/fixture)
        with:
          go-version-file: go.mod
      - run: npm ci
      - name: unit and page tests
        run: npm test -- --run
      - name: build
        run: npm run build

  # the concert-video skill, end to end: a made-up show recorded by tabula
  # from the emulator, then its chapters, chat, sound and video
  concert-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg python3-numpy python3-cairo python3-gi python3-gi-cairo \
            gir1.2-pango-1.0 fonts-noto-core fonts-noto-mono fonts-dejavu-core
      - name: build tabula
        run: go build -o bin/ ./cmd/...
      - name: the demo show and its video
        run: .claude/skills/concert-video/scripts/demo/make_demo.sh "$RUNNER_TEMP/demo"
      - name: check the video
        working-directory: ${{ runner.temp }}/demo/project
        run: |
          set -e
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 render/demo.mp4)" = "2560,1072"
          test "$(ffprobe -v error -show_chapters -of csv=p=0 render/demo.mp4 | wc -l)" = 2
          grep -q "Second Song - The Demo Band" chapters.txt
          python3 -I -c 'import json, glob; g = json.load(open(glob.glob("analysis/*-gestures.json")[0])); assert len(g) >= 8, len(g); print(len(g), "changes in the chat")'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: concert-video-demo
          path: |
            ${{ runner.temp }}/demo/project/still.png
            ${{ runner.temp }}/demo/project/chapters.txt
            ${{ runner.temp }}/demo/tmp/*.log
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux/amd64, linux/arm64, darwin/arm64, windows/amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build ${{ matrix.target }}
        run: |
          export GOOS=${TARGET%/*} GOARCH=${TARGET#*/} CGO_ENABLED=0
          go build -o /dev/null ./...
        env:
          TARGET: ${{ matrix.target }}
