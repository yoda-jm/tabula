name: Release

# Pushing a tag such as v0.1.0 builds the binaries and publishes a GitHub
# release; tags below v1 are marked as pre-releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        run: go test -count=1 ./...
      - name: build
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*} arch=${target#*/}
            name=tabula-${GITHUB_REF_NAME}-${os}-${arch}
            mkdir -p "build/$name"
            for cmd in cmd/*/; do
              bin=$(basename "$cmd")
              [ "$os" = windows ] && bin="$bin.exe"
              GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
                -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "build/$name/$bin" "./$cmd"
            done
            cp README.md "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags="--generate-notes --verify-tag"
          case "$GITHUB_REF_NAME" in v0.*) flags="$flags --prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "tabula $GITHUB_REF_NAME" $flags
