name: Release

# Pushing a tag such as v0.1.0 builds the binaries and publishes a GitHub
# release; tags below v1 are marked as pre-releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: GUI
        working-directory: web
        run: |
          npm ci
          npm test -- --run
          npm run build
      - name: test
        run: go test -count=1 ./...
      - name: build
        run: scripts/dist.sh "$GITHUB_REF_NAME" "$GITHUB_REF_NAME"
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags="--generate-notes --verify-tag"
          case "$GITHUB_REF_NAME" in v0.*) flags="$flags --prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "tabula $GITHUB_REF_NAME" $flags
